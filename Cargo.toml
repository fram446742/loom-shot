[package]
name = "loom-shot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[[bin]]
name = "loom-shot"
path = "src/main.rs"

[dependencies]
niri-ipc = { path = "../niri-ipc" }
serde_json = "1"
libc = "0.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
zbus = "5"
anyhow = "1"
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"

[workspace]
